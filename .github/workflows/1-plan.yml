name: test_vm_and_s3_plan

# STAGE 1 of 2 — plan only. Its own box in Actions. It writes nothing and ends.
# When you have read the plan, start stage 2 separately:
#   Actions → 2-deploy → Run workflow → type the approval phrase.

on:
  workflow_dispatch: {}

# repo secrets → GitHub prints *** in the log instead of the values
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_PAGER: ""
  NO_COLOR: "1"
  TOFU_DISABLE_COLOR: "1"

jobs:
  test_vm_and_s3_plan:
    runs-on: self-hosted            # = the tiny vm (registered self-hosted runner)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the vm's python tooling
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade boto3 botocore s3transfer >/dev/null
          python3 -c "import boto3; print('boto3', boto3.__version__)"

      - name: Show the vm + the whole EC2 graph
        run: |
          set -euo pipefail
          echo "LOCALEMU_INSTANCE_ID=${LOCALEMU_INSTANCE_ID:-?}  type=${LOCALEMU_INSTANCE_TYPE:-?}"
          echo "gateway=${AWS_ENDPOINT_URL:-?}"
          curl -sS -m 5 -H 'Accept: text/plain' http://169.254.169.254/latest/meta-data/instance-id || true
          python3 tools/vm-inspect.py --bucket localemu-runner-logs --prefix runner/ || true

      - name: Install OpenTofu (through the vm's internet egress)
        run: |
          set -euo pipefail
          if [ ! -x /usr/local/bin/tofu ]; then
            curl -fsSL -o /tmp/tofu.tar.gz "https://github.com/opentofu/opentofu/releases/download/v1.13.2/tofu_1.13.2_linux_amd64.tar.gz"
            mkdir -p /tmp/tofu-bin
            tar -xzf /tmp/tofu.tar.gz -C /tmp/tofu-bin
            mv "$(find /tmp/tofu-bin -type f -name tofu | head -1)" /usr/local/bin/tofu
            chmod 755 /usr/local/bin/tofu
          fi
          tofu version

      - name: Pull tfstate out of the persistent state bucket
        run: |
          set -euo pipefail
          cd github_runner
          aws s3 cp "s3://localemu-tf-state/state/aws_test.tfstate" terraform.tfstate \
            || echo "no tfstate yet (fresh deploy)"

      - name: tofu plan (writes nothing)
        run: |
          set -euo pipefail
          cd github_runner
          rm -f .terraform.lock.hcl
          tofu init
          tofu plan -var gateway_host=host.docker.internal -out /tmp/plan.bin \
            >/tmp/plan.txt 2>/tmp/plan.err || echo "tofu plan exit=$?"
          sed -r -i 's/\x1b\[[0-9;?]*[a-zA-Z]//g' /tmp/plan.txt /tmp/plan.err
          echo "-- plan stdout ($(wc -l </tmp/plan.txt) lines) --"
          cat /tmp/plan.txt
          echo "-- plan stderr ($(wc -l </tmp/plan.err) lines) --"
          cat /tmp/plan.err
          echo "-- resource lines --"
          grep -E "^ *[+#~-] aws_|will be created|will be updated|will be destroyed|Plan:|No changes" /tmp/plan.txt || echo "(no plan lines)"
          {
            echo "## STAGE 1/2 — plan (nothing deployed)"
            echo "- vm: \`${LOCALEMU_INSTANCE_ID:-?}\`  gateway: \`${AWS_ENDPOINT_URL:-?}\`"
            echo "- state: \`s3://localemu-tf-state/state/aws_test.tfstate\`"
            echo '```'
            grep -E "^ *[+#~-] aws_|will be created|will be updated|will be destroyed|Plan:|No changes" /tmp/plan.txt || true
            echo '```'
            echo "> Stage 2 is a **separate box**: Actions → **2-deploy** → Run workflow"
            echo "> → type the approval phrase in the input."
          } >> "$GITHUB_STEP_SUMMARY"
