name: deploy

# Deploys the gh_runner/ terraform project against LocalEmu — the free,
# open-source AWS emulator that runs on the runner itself ("local AWS": no
# account, no token, endpoint is localhost:4566 on the runner).
#
#   runner bootstrap:  docker daemon -> OpenTofu -> pip install localemu
#                      -> localemu start (foreground, logged, polled)
#   terraform:         VPC + Internet Gateway + subnet + SG + tiny vm
#                      + bucket + folder marker + manifest
#   the vm:            docker exec into localemu-ec2-i-… : aws s3 cp up,
#                      read back, sha256 compare
#
# Why not `localemu start -d`: detached mode re-execs `python -m
# localemu.runtime.main` with stdout AND stderr sent to DEVNULL, so a startup
# failure is invisible and the gateway just sits connection-refused. bootstrap.sh
# starts it in the foreground as a background job, keeps the log, and dumps the
# log if the gateway never binds.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04        # python3.12 (localemu requires >=3.10)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenTofu
        run: |
          set -euo pipefail
          url="https://github.com/opentofu/opentofu/releases/download/v1.13.2/tofu_1.13.2_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/tofu.tar.gz "$url"
          mkdir -p /tmp/tofu-bin
          tar -xzf /tmp/tofu.tar.gz -C /tmp/tofu-bin
          bin="$(find /tmp/tofu-bin -type f -name tofu | head -1)"
          echo "tofu binary: $bin"
          sudo mv "$bin" /usr/local/bin/tofu
          sudo chmod 755 /usr/local/bin/tofu
          tofu version

      - name: Install LocalEmu
        run: |
          set -euo pipefail
          sudo apt-get install -y python3-pip || true
          python3 -m pip install --upgrade localemu
          localemu --help | head -4
          awsemu --version | head -1
          python3 --version

      - name: Bootstrap the local AWS emulator on the runner
        run: gh_runner/bootstrap.sh

      - name: tofu init / plan / apply (gh_runner project)
        run: |
          set -euo pipefail
          cd gh_runner
          tofu init
          tofu plan
          tofu apply --auto-approve
          echo "instance_id=$(tofu output --raw ec2_instance_id)" >> "$GITHUB_OUTPUT"
          echo "vm_container=$(tofu output --raw vm_container)"   >> "$GITHUB_OUTPUT"
          echo "igw_id=$(tofu output --raw igw_id)"               >> "$GITHUB_OUTPUT"
        id: coords

      - name: tiny vm -> s3 (aws s3 cp from inside the emulated vm)
        run: |
          set -euo pipefail
          CID="$(cd gh_runner && tofu output --raw vm_container)"
          BUCKET="$(cd gh_runner && tofu output --raw s3_root)"
          BUCKET="${BUCKET#s3://}"; BUCKET="${BUCKET%%/*}"; PREFIX="vm"
          echo "container: $CID   bucket: $BUCKET   prefix: $PREFIX"
          docker exec -i -e BUCKET="$BUCKET" -e PREFIX="$PREFIX" "$CID" bash -s \
            < gh_runner/vm/drop-to-s3.sh
          docker exec -i -e BUCKET="$BUCKET" -e PREFIX="$PREFIX" "$CID" bash -s \
            < gh_runner/vm/verify-in-vm.sh

      - name: verify the bucket from the host
        run: |
          set -euo pipefail
          awsemu s3 ls --recursive "s3://localemu-gh-runner/vm/"
          python3 gh_runner/tools/vm-inspect.py \
            --instance "$(cd gh_runner && tofu output --raw ec2_instance_id)" \
            --bucket localemu-gh-runner --prefix vm/

      - name: summary
        run: |
          {
            echo "## deploy result (LocalEmu on the runner)"
            echo "- vm: \`$(cd gh_runner && tofu output --raw ec2_instance_id)\` @ \`$(cd gh_runner && tofu output --raw ec2_private_ip)\`"
            echo "- internet gateway: \`$(cd gh_runner && tofu output --raw igw_id)\`"
            echo "- container: \`$(cd gh_runner && tofu output --raw vm_container)\`"
            echo "- bucket: \`s3://localemu-gh-runner/vm/\`"
            echo '```'
            (cd gh_runner && tofu plan --summary)
            awsemu s3 ls --recursive "s3://localemu-gh-runner/vm/"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: stop the emulator
        if: always()
        continue-on-error: true
        run: localemu stop || true
